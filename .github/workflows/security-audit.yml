name: Security Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  audit-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: NPM Audit (critical)
        run: npm audit --audit-level=critical

  audit-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: NPM Audit (critical)
        run: npm audit --audit-level=critical --workspace apps/mobile
